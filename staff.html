<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YOHAKU｜注文管理</title>
<style>
  :root{
    --ink:#2b2b28; --muted:#8a867c; --line:#e7e2d8; --bg:#f7f5f0;
    --accent:#5c6650; --accent-dark:#47523e; --alert:#b3543f;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--ink); padding-bottom:40px;
  }
  /* PIN画面 */
  #pinView{ max-width:340px; margin:70px auto; padding:0 20px; text-align:center; }
  #pinView .brand{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:24px; letter-spacing:.4em; text-indent:.4em;
  }
  #pinView p{ font-size:12px; color:var(--muted); margin:14px 0 20px; }
  #pinInput{
    width:100%; font-size:26px; text-align:center; letter-spacing:.6em; text-indent:.6em;
    padding:12px; border:1px solid var(--line); border-radius:10px; background:#fff;
  }
  #pinBtn{
    width:100%; margin-top:14px; padding:14px; border:none; border-radius:10px;
    background:var(--accent); color:#fff; font-size:16px; letter-spacing:.2em; cursor:pointer;
  }
  #pinError{ color:var(--alert); font-size:12px; margin-top:10px; min-height:16px; }

  /* メイン */
  #mainView{ display:none; }
  .topbar{
    position:sticky; top:0; z-index:10; background:#fff; border-bottom:1px solid var(--line);
    padding:12px 16px;
  }
  .topbar-row{ max-width:640px; margin:0 auto; display:flex; align-items:flex-end; gap:18px; padding-left:58px; }
  .stat{ flex:1; }
  .stat-label{ font-size:11px; color:var(--muted); letter-spacing:.12em; }
  .stat-value{ font-family:"Hiragino Mincho ProN","Yu Mincho",serif; font-size:27px; font-weight:700; }
  .stat-value.pending{ color:var(--alert); }
  .conn{ font-size:10px; color:var(--muted); text-align:right; }
  main{ max-width:640px; margin:0 auto; padding:14px 14px 0; }
  .order-card{
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:16px; margin-bottom:12px; box-shadow:0 2px 8px rgba(60,55,40,.05);
  }
  .order-card.is-new{ border-color:var(--alert); border-width:2px; }
  .oc-head{ display:flex; align-items:baseline; gap:12px; }
  .oc-seat{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:30px; font-weight:700;
  }
  .oc-no{ font-size:15px; color:var(--muted); }
  .oc-elapsed{ margin-left:auto; font-size:13px; color:var(--muted); }
  .oc-elapsed.late{ color:var(--alert); font-weight:700; }
  .oc-lines{ margin-top:10px; font-size:15px; line-height:1.75; }
  .oc-lines .lq{ color:var(--muted); font-size:13px; }
  .oc-total{
    margin-top:10px; text-align:right;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:26px; font-weight:700;
  }
  .oc-total .tax{ font-size:11px; color:var(--muted); font-family:inherit; font-weight:400; }
  .oc-btn{
    width:100%; margin-top:12px; padding:15px; border-radius:10px; border:none;
    font-size:16px; letter-spacing:.15em; cursor:pointer; font-weight:600;
  }
  .oc-btn.to-served{ background:var(--accent); color:#fff; }
  .oc-btn.to-new{ background:#fff; color:var(--muted); border:1px solid var(--line); }
  .order-card.is-served{ opacity:.55; }
  /* テーブル（席）カード */
  .seat-card{
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:16px; margin-bottom:14px; box-shadow:0 2px 8px rgba(60,55,40,.05);
  }
  .seat-card.has-new{ border-color:var(--alert); border-width:2px; }
    .seat-card.all-paid{ opacity:.55; }
  .paid-tab-btn{
    width:100%; padding:14px; margin:6px 0 14px; background:#fff; color:var(--muted);
    border:1px solid var(--line); border-radius:12px; font-size:15px; letter-spacing:.12em; cursor:pointer;
  }
  .seat-head{ display:flex; align-items:flex-start; gap:14px; }
  .seat-name{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:32px; font-weight:700; white-space:nowrap;
  }
  .seat-amounts{ margin-left:auto; text-align:right; }
  .seat-amounts span{ display:block; }
  .seat-total{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:22px; font-weight:700;
  }
  .seat-unpaid{ font-size:14px; color:var(--alert); font-weight:700; margin-top:2px; }
  .seat-unpaid.none{ color:var(--muted); font-weight:400; }
  .so-block{ border-top:1px dashed var(--line); margin-top:12px; padding-top:12px; }
  .so-block.is-served{ opacity:.55; }
  .so-head{ display:flex; align-items:baseline; gap:10px; }
  .so-no{ font-size:15px; font-weight:600; }
  .paid-badge{
    font-size:11px; color:#fff; background:var(--accent); border-radius:6px;
    padding:2px 8px; letter-spacing:.1em; white-space:nowrap;
  }
  .so-total{
    margin-top:8px; text-align:right;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:20px; font-weight:700;
  }
  .so-total .tax{ font-size:11px; color:var(--muted); font-family:inherit; font-weight:400; }
  .pay-btn{
    width:100%; margin-top:16px; padding:15px; border-radius:10px; border:none;
    font-size:16px; letter-spacing:.15em; cursor:pointer; font-weight:600;
  }
  .pay-btn.to-pay{ background:var(--accent-dark); color:#fff; }
  .pay-btn.done{ background:#fff; color:var(--muted); border:1px solid var(--line); cursor:default; }
  /* 注文の変更・取消ボタン */
  .so-actions{ display:flex; gap:8px; margin-top:10px; }
  .so-actions .small-btn{ flex:1; padding:11px; font-size:14px; }
  /* 数量ステッパー */
  .stepper{ display:flex; align-items:center; gap:4px; }
  .step-btn{
    width:42px; height:42px; border-radius:10px; border:1px solid var(--line);
    background:#fff; font-size:20px; cursor:pointer; line-height:1;
  }
  .step-btn:disabled{ opacity:.35; cursor:default; }
  .step-qty{ min-width:34px; text-align:center; font-size:17px; font-weight:700; }
  /* 注文編集モード */
  .edit-line{
    display:flex; align-items:center; gap:8px; padding:8px 0;
    border-bottom:1px dashed var(--line);
  }
  .edit-line .el-info{ flex:1; min-width:0; }
  .edit-line .el-name{ font-size:15px; font-weight:600; }
  .edit-line .el-price{ font-size:12px; color:var(--muted); }
  .edit-line .el-sub{ font-size:15px; font-weight:700; white-space:nowrap; min-width:64px; text-align:right; }
  .edit-add{ display:flex; gap:8px; margin-top:12px; }
  .edit-add select{
    flex:1; font-size:15px; padding:10px; border:1px solid var(--line);
    border-radius:8px; background:#fff; min-width:0;
  }
  .edit-total{
    margin-top:12px; text-align:right;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif; font-size:22px; font-weight:700;
  }
  .edit-total .tax{ font-size:11px; color:var(--muted); font-family:inherit; font-weight:400; }
  .edit-warn{ color:var(--alert); font-size:13px; margin-top:10px; line-height:1.7; }
  .edit-btns{ display:flex; gap:8px; margin-top:12px; }
  .edit-btns .oc-btn{ margin-top:0; flex:1; }
  /* スタッフ注文 */
  .panel-open-btn{
    width:100%; padding:15px; border-radius:10px; cursor:pointer;
    border:1px dashed var(--accent); background:#fff; color:var(--accent-dark);
    font-size:16px; letter-spacing:.12em; font-weight:600;
  }
  .staff-panel{
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:16px; margin-top:12px; box-shadow:0 2px 8px rgba(60,55,40,.05);
  }
  .staff-panel select#staffSeat{
    font-size:17px; padding:10px; border:1px solid var(--line); border-radius:8px; background:#fff;
  }
  .staff-item{
    display:flex; align-items:center; gap:8px; padding:10px 0;
    border-bottom:1px dashed var(--line);
  }
  .staff-item .si-info{ flex:1; min-width:0; }
  .staff-item .si-name{ font-size:15px; font-weight:600; }
  .staff-item .si-price{ font-size:12px; color:var(--muted); }
  .staff-item.is-soldout{ opacity:.5; }
  .soldout-badge{
    font-size:11px; color:#fff; background:var(--alert); border-radius:6px;
    padding:2px 8px; letter-spacing:.1em; white-space:nowrap; margin-left:6px;
  }
  .staff-total{
    margin-top:14px; text-align:right;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif; font-size:24px; font-weight:700;
  }
  .staff-total .tax{ font-size:11px; color:var(--muted); font-family:inherit; font-weight:400; }
  .add-order-btn{
    width:100%; margin-top:12px; padding:13px; border-radius:10px; cursor:pointer;
    background:#fff; color:var(--accent-dark); border:1px solid var(--accent);
    font-size:15px; letter-spacing:.12em; font-weight:600;
  }
  .empty{ text-align:center; color:var(--muted); font-size:14px; padding:44px 0; }
  .section-title{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:16px; letter-spacing:.25em; margin:30px 0 10px; color:var(--accent-dark);
  }
  /* メニュー管理 */
  .menu-row{
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:12px; margin-bottom:10px;
  }
  .menu-row .mr-name{ font-size:15px; font-weight:600; }
  .menu-row .mr-cat{ font-size:11px; color:var(--muted); margin-left:8px; }
  .mr-fields{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center; }
  .mr-fields label{ font-size:11px; color:var(--muted); }
  .mr-fields input[type=text], .mr-fields input[type=number]{
    font-size:15px; padding:8px; border:1px solid var(--line); border-radius:8px; background:#fff;
  }
  .mr-fields input.price{ width:100px; }
  .mr-fields input.sort{ width:64px; }
  .mr-fields input.name-in{ width:100%; }
  .mr-fields input.desc-in{ width:100%; }
  .mr-fields select{ font-size:14px; padding:8px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .soldout-toggle{
    display:flex; align-items:center; gap:6px; font-size:13px;
    padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:pointer;
  }
  .soldout-toggle.on{ background:#f0e9e2; border-color:var(--alert); color:var(--alert); font-weight:700; }
  .small-btn{
    padding:9px 14px; border-radius:8px; border:1px solid var(--line);
    background:#fff; font-size:13px; cursor:pointer;
  }
  .small-btn.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .small-btn.danger{ color:var(--alert); border-color:#e0c4bd; }
  .add-form{ background:#fff; border:1px dashed var(--line); border-radius:12px; padding:12px; }
  /* 売上集計 */
  .sales-box{
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:16px; box-shadow:0 2px 8px rgba(60,55,40,.05);
  }
  .sales-date-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .sales-date-row input[type=date]{
    font-size:16px; padding:9px; border:1px solid var(--line); border-radius:8px; background:#fff;
  }
  .day-btn{
    padding:9px 13px; border-radius:8px; border:1px solid var(--line);
    background:#fff; font-size:13px; cursor:pointer;
  }
  .day-btn.active{ background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700; }
  .sales-grid{ display:flex; flex-wrap:wrap; gap:10px 18px; margin-top:14px; }
  .sales-grid .sg-item{ min-width:100px; }
  .sales-grid .sg-label{ font-size:11px; color:var(--muted); letter-spacing:.1em; }
  .sales-grid .sg-value{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif; font-size:22px; font-weight:700;
  }
  .sales-grid .sg-value.pending{ color:var(--alert); }
  .sales-table{ width:100%; border-collapse:collapse; margin-top:8px; font-size:14px; }
  .sales-table th, .sales-table td{
    padding:8px 6px; border-bottom:1px dashed var(--line); text-align:right;
  }
  .sales-table th{ font-size:11px; color:var(--muted); letter-spacing:.08em; font-weight:400; }
  .sales-table th:first-child, .sales-table td:first-child{ text-align:left; }
  .sales-period{ font-size:13px; color:var(--muted); margin-top:14px; line-height:1.8; }
  .sales-period b{ color:var(--ink); }
  .csv-row{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .csv-row .small-btn{ flex:1; padding:12px; font-size:14px; white-space:nowrap; }
  /* 注文履歴 */
  .hist-title{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:14px; letter-spacing:.2em; margin:20px 0 8px; color:var(--accent-dark);
  }
  .hist-filter-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .hist-btn{
    padding:8px 13px; border-radius:8px; border:1px solid var(--line);
    background:#fff; font-size:13px; cursor:pointer;
  }
  .hist-btn.active{ background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700; }
  .hist-row{ border-top:1px dashed var(--line); padding:10px 0; }
  .hist-head{ display:flex; align-items:baseline; gap:10px; font-size:14px; }
  .hist-time{ color:var(--muted); font-size:13px; white-space:nowrap; }
  .hist-no{ font-weight:600; white-space:nowrap; }
  .hist-seat{ white-space:nowrap; }
  .hist-total{
    margin-left:auto; font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:17px; font-weight:700; white-space:nowrap;
  }
  .hist-lines{ font-size:13px; color:var(--ink); line-height:1.7; margin-top:4px; }
  .unpaid-badge{
    font-size:11px; color:var(--alert); background:#fff; border:1px solid var(--alert);
    border-radius:6px; padding:2px 8px; letter-spacing:.1em; white-space:nowrap;
  }
  .error-box{
    max-width:640px; margin:14px auto 0; padding:14px 18px; border:1px solid #d8a7a0;
    background:#fdf3f1; border-radius:10px; font-size:13px; line-height:1.8; display:none;
  }
  .wrap-pad{ padding:0 14px; }
  /* ハンバーガードロワー */
  #drawerBtn{
    position:fixed; top:12px; left:12px; z-index:40;
    width:48px; height:48px; border-radius:12px; border:1px solid var(--line);
    background:#fff; box-shadow:0 2px 10px rgba(60,55,40,.18);
    font-size:22px; line-height:1; color:var(--ink); cursor:pointer;
  }
  #drawerOverlay{
    position:fixed; inset:0; z-index:50; background:rgba(43,43,40,.45);
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  #drawerOverlay.open{ opacity:1; pointer-events:auto; }
  #drawer{
    position:fixed; top:0; left:0; bottom:0; z-index:60;
    width:264px; max-width:82vw; background:#fff;
    box-shadow:2px 0 16px rgba(60,55,40,.18);
    transform:translateX(-105%); transition:transform .28s ease;
    display:flex; flex-direction:column;
  }
  #drawer.open{ transform:translateX(0); }
  .drawer-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px; border-bottom:1px solid var(--line);
  }
  .drawer-title{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:16px; letter-spacing:.18em; color:var(--accent-dark);
  }
  #drawerClose{
    width:40px; height:40px; border-radius:10px; border:1px solid var(--line);
    background:#fff; font-size:16px; color:var(--ink); cursor:pointer; flex:none;
  }
  .drawer-item{
    display:block; width:100%; text-align:left; padding:17px 16px;
    font-size:16px; letter-spacing:.08em; color:var(--ink);
    background:none; border:none; border-bottom:1px solid var(--line);
    cursor:pointer; font-family:inherit;
  }
  /* ドロワーからの移動先が sticky ヘッダーに隠れないように */
  #ordersRoot, #staffSection, #staffPanel, #menuSection, #salesSection{ scroll-margin-top:88px; }
</style>
</head>
<body>

<!-- PIN -->
<div id="pinView">
  <div class="brand">YOHAKU</div>
  <p>注文管理画面 ｜ PINを入力してください</p>
  <input id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" autocomplete="off" placeholder="PIN">
  <button id="pinBtn">開く</button>
  <div id="pinError"></div>
</div>

<!-- メイン -->
<div id="mainView">
  <button id="drawerBtn" type="button" aria-label="メニューを開く">☰</button>
  <div id="drawerOverlay"></div>
  <nav id="drawer" aria-label="セクション移動">
    <div class="drawer-head">
      <span class="drawer-title">YOHAKU 注文管理</span>
      <button id="drawerClose" type="button" aria-label="メニューを閉じる">✕</button>
    </div>
    <button class="drawer-item" id="navOrders" type="button">本日の注文</button>
    <button class="drawer-item" id="navStaff" type="button">スタッフ注文</button>
    <button class="drawer-item" id="navMenu" type="button">メニュー管理</button>
    <button class="drawer-item" id="navSales" type="button">売上集計</button>
  </nav>

  <div class="topbar">
    <div class="topbar-row">
      <div class="stat">
        <div class="stat-label">未提供</div>
        <div class="stat-value pending" id="pendingCount">0 件</div>
      </div>
      <div class="stat">
        <div class="stat-label">本日の売上（税込）</div>
        <div class="stat-value" id="salesTotal">¥0</div>
      </div>
      <div class="stat">
        <div class="stat-label">未決済合計</div>
        <div class="stat-value pending" id="unpaidTotal">¥0</div>
      </div>
      <div class="conn" id="connStatus">接続中…</div>
    </div>
  </div>

  <div class="wrap-pad"><div class="error-box" id="errorBox"></div></div>

  <main>
    <div id="ordersRoot"><div class="empty">読み込んでいます…</div></div>

    <div class="section-title" id="staffSection">スタッフ注文</div>
    <button class="panel-open-btn" id="staffOpenBtn">＋ スタッフ注文を入れる</button>
    <div class="staff-panel" id="staffPanel" style="display:none">
      <div class="mr-fields">
        <label>席番号
          <select id="staffSeat"></select>
        </label>
      </div>
      <div id="staffItems"></div>
      <div class="staff-total">合計 <span id="staffTotal">¥0</span> <span class="tax">税込</span></div>
      <button class="oc-btn to-served" id="staffSubmit">注文を入れる</button>
      <button class="oc-btn to-new" id="staffCloseBtn">閉じる</button>
    </div>

    <div class="section-title" id="menuSection">メニュー管理</div>
    <div id="menuRoot"></div>

    <div class="section-title">品目を追加</div>
    <div class="add-form">
      <div class="mr-fields">
        <input type="text" class="name-in" id="addName" placeholder="品目名">
        <input type="text" class="desc-in" id="addDesc" placeholder="説明（任意）">
        <label>価格 <input type="number" class="price" id="addPrice" min="0" step="1" placeholder="900"></label>
        <select id="addCategory">
          <option value="meat">お肉（数量限定）</option>
          <option value="snack">おつまみ</option>
          <option value="soup">汁物</option>
          <option value="glass_wine">グラスワイン</option>
          <option value="bottle_wine">ボトルワイン</option>
          <option value="shochu">球磨焼酎</option>
          <option value="beer">ビール</option>
          <option value="soft_drink">ソフトドリンク</option>
        </select>
        <label>並び順 <input type="number" class="sort" id="addSort" value="50"></label>
        <button class="small-btn primary" id="addBtn">追加する</button>
      </div>
    </div>
    <div class="section-title" id="salesSection">売上集計</div>
    <div class="sales-box">
      <div class="sales-date-row">
        <input type="date" id="salesDate">
        <button class="day-btn" data-day="2026-11-13">11/13（金）</button>
        <button class="day-btn" data-day="2026-11-14">11/14（土）</button>
        <button class="day-btn" data-day="2026-11-15">11/15（日）</button>
      </div>
      <div id="salesRoot"><div class="empty">読み込んでいます…</div></div>
      <div class="sales-period" id="salesPeriod"></div>
      <div class="csv-row">
        <button class="small-btn" id="csvItemsBtn">品目別CSV</button>
        <button class="small-btn" id="csvOrdersBtn">注文明細CSV</button>
      </div>
    </div>

    <p style="font-size:11px;color:var(--muted);margin-top:14px;line-height:1.8">
      価格は税込・円（整数）で入力してください。売り切れ切替と価格変更は即座にお客様の画面へ反映されます。
    </p>
  </main>
</div>

<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";
  var cfg = window.YOHAKU_CONFIG || {};
  var errorBox = document.getElementById('errorBox');
  function showError(msg){
    errorBox.style.display = 'block';
    errorBox.textContent = msg;
  }
  function yen(n){ return '¥' + n.toLocaleString('ja-JP'); }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  var configOk = cfg.SUPABASE_URL && cfg.SUPABASE_URL.indexOf('YOUR_') !== 0 &&
                 cfg.SUPABASE_ANON_KEY && cfg.SUPABASE_ANON_KEY.indexOf('YOUR_') !== 0;
  if (!configOk) {
    document.querySelector('#pinView p').textContent =
      '設定が完了していません。config.js に Supabase の URL と anon key を設定してください。';
    document.getElementById('pinBtn').disabled = true;
    document.getElementById('pinInput').disabled = true;
    return;
  }
  var sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

  // ---------- PIN ----------
  var pinView = document.getElementById('pinView');
  var mainView = document.getElementById('mainView');
  var started = false;

  function tryStart(){
    if (started) return;
    started = true;
    pinView.style.display = 'none';
    mainView.style.display = 'block';
    startApp();
  }
  if (sessionStorage.getItem('yohaku_staff') === '1') tryStart();

  document.getElementById('pinBtn').addEventListener('click', checkPin);
  document.getElementById('pinInput').addEventListener('keydown', function(e){
    if (e.key === 'Enter') checkPin();
  });
  function checkPin(){
    var v = document.getElementById('pinInput').value;
    if (v === String(cfg.STAFF_PIN || '1234')) {
      sessionStorage.setItem('yohaku_staff', '1');
      tryStart();
    } else {
      document.getElementById('pinError').textContent = 'PINが違います';
    }
  }

  // ---------- 本体 ----------
  var orders = [];
  var paidTabOpen = false;
  var pollingTimer = null;
  var connStatus = document.getElementById('connStatus');

  function todayStartISO(){
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    return d.toISOString();
  }

  function loadOrders(){
    return sb.from('orders').select('id, order_no, seat_no, lines, total, status, paid, created_at')
      .gte('created_at', todayStartISO())
      .order('created_at', { ascending: false })
      .then(function(res){
        if (res.error) { showError('注文の取得に失敗しました。再読み込みしてください。'); return; }
        orders = res.data || [];
        // 編集中の注文が一覧から消えていたらドラフトを破棄
        if (editDraft && !orders.some(function(o){ return o.id === editDraft.orderId; })) {
          editDraft = null;
        }
        renderOrders();
        renderStats();
      });
  }

  function renderStats(){
    var pending = 0, sales = 0, unpaid = 0;
    orders.forEach(function(o){
      sales += o.total;
      if (o.status === 'new') pending++;
      if (!o.paid) unpaid += o.total;
    });
    document.getElementById('pendingCount').textContent = pending + ' 件';
    document.getElementById('salesTotal').textContent = yen(sales);
    document.getElementById('unpaidTotal').textContent = yen(unpaid);
  }

  function elapsedText(iso){
    var min = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
    if (min < 1) return 'たった今';
    if (min < 60) return min + '分前';
    return Math.floor(min / 60) + '時間' + (min % 60) + '分前';
  }

  function renderOrders(){
    var root = document.getElementById('ordersRoot');
    root.innerHTML = '';
    if (orders.length === 0) {
      root.innerHTML = '<div class="empty">本日の注文はまだありません</div>';
      return;
    }
    // 席ごとにグループ化（席内の注文は新しい順）
    var bySeat = {};
    orders.forEach(function(o){
      if (!bySeat[o.seat_no]) bySeat[o.seat_no] = [];
      bySeat[o.seat_no].push(o);
    });
    var seats = Object.keys(bySeat).map(function(k){
      // 席内でも未決済の注文を上に、決済済みの注文は下に（それぞれ新しい順）
      var list = bySeat[k].slice().sort(function(a, b){
        if (!!a.paid !== !!b.paid) return a.paid ? 1 : -1;
        return new Date(b.created_at) - new Date(a.created_at);
      });
      var total = 0, unpaid = 0, hasUnpaidOrder = false, hasNew = false;
      list.forEach(function(o){
        total += o.total;
        if (!o.paid) { unpaid += o.total; hasUnpaidOrder = true; }
        if (o.status === 'new') hasNew = true;
      });
      return {
        seatNo: Number(k), list: list, total: total, unpaid: unpaid,
        hasUnpaidOrder: hasUnpaidOrder, hasNew: hasNew, lastAt: list[0].created_at
      };
    });
    // 未決済の席を上に（その中では最終注文が新しい順）、決済済みだけの席は下に
    seats.sort(function(a, b){
      if (a.hasUnpaidOrder !== b.hasUnpaidOrder) return a.hasUnpaidOrder ? -1 : 1;
      return new Date(b.lastAt) - new Date(a.lastAt);
    });

    var activeSeats = seats.filter(function(s){ return s.hasUnpaidOrder; });
    var paidSeats = seats.filter(function(s){ return !s.hasUnpaidOrder; });

    function buildSeatCard(seat){
      var card = document.createElement('div');
      card.className = 'seat-card' +
        (seat.hasNew ? ' has-new' : '') +
        (!seat.hasUnpaidOrder ? ' all-paid' : '');

      var head = document.createElement('div');
      head.className = 'seat-head';
      head.innerHTML =
        '<span class="seat-name">' + seat.seatNo + '番席</span>' +
        '<span class="seat-amounts">' +
          '<span class="seat-total">合計 ' + yen(seat.total) + '</span>' +
          (seat.hasUnpaidOrder
            ? '<span class="seat-unpaid">未決済 ' + yen(seat.unpaid) + '</span>'
            : '<span class="seat-unpaid none">決済済み</span>') +
        '</span>';
      card.appendChild(head);

      seat.list.forEach(function(o){
        if (editDraft && editDraft.orderId === o.id) {
          card.appendChild(buildEditBlock(o));
          return;
        }
        var block = document.createElement('div');
        block.className = 'so-block' + (o.status === 'served' ? ' is-served' : '');

        var linesHtml = (o.lines || []).map(function(l){
          return escapeHtml(l.name) + ' <span class="lq">×' + l.qty + '（' + yen(l.price) + '）</span>';
        }).join('<br>');

        var elapsedMin = Math.floor((Date.now() - new Date(o.created_at).getTime()) / 60000);
        var late = o.status === 'new' && elapsedMin >= 10;

        block.innerHTML =
          '<div class="so-head">' +
            '<span class="so-no">No.' + o.order_no + '</span>' +
            (o.paid ? '<span class="paid-badge">決済済み</span>' : '') +
            '<span class="oc-elapsed' + (late ? ' late' : '') + '" data-elapsed="' + o.created_at + '">' + elapsedText(o.created_at) + '</span>' +
          '</div>' +
          '<div class="oc-lines">' + linesHtml + '</div>' +
          '<div class="so-total">' + yen(o.total) + ' <span class="tax">税込</span></div>';

        var btn = document.createElement('button');
        if (o.status === 'new') {
          btn.className = 'oc-btn to-served';
          btn.textContent = '提供済みにする';
          btn.addEventListener('click', function(){ setStatus(o.id, 'served', btn); });
        } else {
          btn.className = 'oc-btn to-new';
          btn.textContent = '未提供に戻す';
          btn.addEventListener('click', function(){ setStatus(o.id, 'new', btn); });
        }
        block.appendChild(btn);

        var actions = document.createElement('div');
        actions.className = 'so-actions';
        var editBtn = document.createElement('button');
        editBtn.className = 'small-btn';
        editBtn.textContent = '変更';
        editBtn.addEventListener('click', function(){ startEdit(o); });
        actions.appendChild(editBtn);
        var cancelOrderBtn = document.createElement('button');
        cancelOrderBtn.className = 'small-btn danger';
        cancelOrderBtn.textContent = '取消';
        cancelOrderBtn.addEventListener('click', function(){ deleteOrder(o); });
        actions.appendChild(cancelOrderBtn);
        block.appendChild(actions);

        card.appendChild(block);
      });

      var seatAddBtn = document.createElement('button');
      seatAddBtn.className = 'add-order-btn';
      seatAddBtn.textContent = 'この席に追加注文';
      seatAddBtn.addEventListener('click', function(){ openStaffPanel(seat.seatNo); });
      card.appendChild(seatAddBtn);

      var payBtn = document.createElement('button');
      if (seat.hasUnpaidOrder) {
        payBtn.className = 'pay-btn to-pay';
        payBtn.textContent = '決済済みにする';
        payBtn.addEventListener('click', function(){ setPaidForSeat(seat.seatNo, payBtn); });
      } else {
        payBtn.className = 'pay-btn done';
        payBtn.textContent = '決済済み';
        payBtn.disabled = true;
      }
      card.appendChild(payBtn);
      return card;
    }

    if (activeSeats.length === 0) {
      var noneEl = document.createElement('div');
      noneEl.className = 'empty';
      noneEl.textContent = '未決済の席はありません';
      root.appendChild(noneEl);
    }
    activeSeats.forEach(function(seat){ root.appendChild(buildSeatCard(seat)); });

    // 決済済みの席は一番下に「決済済み」タブとしてまとめ、初期状態は閉じる（データは売上集計に残る）
    if (paidSeats.length) {
      var paidBox = document.createElement('div');
      paidBox.style.display = paidTabOpen ? 'block' : 'none';
      var tabBtn = document.createElement('button');
      tabBtn.className = 'paid-tab-btn';
      tabBtn.type = 'button';
      function paintTabBtn(){
        tabBtn.textContent = '決済済み（' + paidSeats.length + '席） ' + (paidTabOpen ? '▲ 閉じる' : '▼ 開く');
      }
      paintTabBtn();
      tabBtn.addEventListener('click', function(){
        paidTabOpen = !paidTabOpen;
        paidBox.style.display = paidTabOpen ? 'block' : 'none';
        paintTabBtn();
      });
      paidSeats.forEach(function(seat){ paidBox.appendChild(buildSeatCard(seat)); });
      root.appendChild(tabBtn);
      root.appendChild(paidBox);
    }
  }

  function setStatus(id, status, btn){
    btn.disabled = true;
    sb.from('orders').update({ status: status }).eq('id', id)
      .then(function(res){
        btn.disabled = false;
        if (res.error) { showError('状態の更新に失敗しました。'); return; }
        orders.forEach(function(o){ if (o.id === id) o.status = status; });
        renderOrders();
        renderStats();
      });
  }

  // その席の本日の未決済注文をすべて決済済みにする
  function setPaidForSeat(seatNo, btn){
    if (!window.confirm(seatNo + '番席を決済済みにしますか？')) return;
    btn.disabled = true;
    sb.from('orders').update({ paid: true })
      .eq('seat_no', seatNo)
      .eq('paid', false)
      .gte('created_at', todayStartISO())
      .then(function(res){
        btn.disabled = false;
        if (res.error) { showError('決済状態の更新に失敗しました。'); return; }
        orders.forEach(function(o){ if (o.seat_no === seatNo) o.paid = true; });
        renderOrders();
        renderStats();
        // サーバー側の最新状態を取り直して、決済済みの席が確実に一番下へ移動したことを保証する
        // （リアルタイム接続が切れている端末でも、押した直後に並びが変わるように）
        loadOrders();
      });
  }

  // ---------- 数量ステッパー（共用） ----------
  function buildStepper(qty, disabled, onChange){
    var wrap = document.createElement('div');
    wrap.className = 'stepper';
    var minus = document.createElement('button');
    minus.className = 'step-btn';
    minus.textContent = '−';
    minus.disabled = !!disabled || qty <= 0;
    minus.addEventListener('click', function(){ onChange(Math.max(0, qty - 1)); });
    var q = document.createElement('span');
    q.className = 'step-qty';
    q.textContent = qty;
    var plus = document.createElement('button');
    plus.className = 'step-btn';
    plus.textContent = '＋';
    plus.disabled = !!disabled;
    plus.addEventListener('click', function(){ onChange(qty + 1); });
    wrap.appendChild(minus);
    wrap.appendChild(q);
    wrap.appendChild(plus);
    return wrap;
  }

  // ---------- 注文の変更・取消 ----------
  // 編集中のドラフト。ポーリング再描画でも消えないようDOMではなく変数に保持する
  var editDraft = null; // { orderId, lines: [{name, price, qty}] }

  function startEdit(o){
    editDraft = {
      orderId: o.id,
      lines: (o.lines || []).map(function(l){
        return { name: l.name, price: l.price, qty: l.qty };
      })
    };
    renderOrders();
  }

  function buildEditBlock(o){
    var block = document.createElement('div');
    block.className = 'so-block';
    var elapsedMin = Math.floor((Date.now() - new Date(o.created_at).getTime()) / 60000);
    var late = o.status === 'new' && elapsedMin >= 10;
    block.innerHTML =
      '<div class="so-head">' +
        '<span class="so-no">No.' + o.order_no + '</span>' +
        (o.paid ? '<span class="paid-badge">決済済み</span>' : '') +
        '<span class="oc-elapsed' + (late ? ' late' : '') + '" data-elapsed="' + o.created_at + '">' + elapsedText(o.created_at) + '</span>' +
      '</div>' +
      '<div style="font-size:12px;color:var(--muted);margin-top:6px">注文を変更中（数量0で品目を削除）</div>';

    editDraft.lines.forEach(function(l, idx){
      var row = document.createElement('div');
      row.className = 'edit-line';
      var info = document.createElement('div');
      info.className = 'el-info';
      info.innerHTML = '<div class="el-name">' + escapeHtml(l.name) + '</div>' +
        '<div class="el-price">' + yen(l.price) + '（税込）</div>';
      row.appendChild(info);
      row.appendChild(buildStepper(l.qty, false, function(nq){
        if (nq <= 0) { editDraft.lines.splice(idx, 1); }
        else { editDraft.lines[idx].qty = nq; }
        renderOrders();
      }));
      var sub = document.createElement('div');
      sub.className = 'el-sub';
      sub.textContent = yen(l.price * l.qty);
      row.appendChild(sub);
      block.appendChild(row);
    });

    // 品目の追加（売り切れ品目は対象外）
    var addRow = document.createElement('div');
    addRow.className = 'edit-add';
    var sel = document.createElement('select');
    var avail = menuItems.filter(function(it){ return !it.sold_out; });
    if (avail.length === 0) {
      var opt0 = document.createElement('option');
      opt0.value = '';
      opt0.textContent = '追加できる品目がありません';
      sel.appendChild(opt0);
    } else {
      avail.forEach(function(it){
        var opt = document.createElement('option');
        opt.value = it.id;
        opt.textContent = it.name + '（' + yen(it.price) + '）';
        sel.appendChild(opt);
      });
    }
    addRow.appendChild(sel);
    var addBtn = document.createElement('button');
    addBtn.className = 'small-btn';
    addBtn.textContent = '追加';
    addBtn.disabled = avail.length === 0;
    addBtn.addEventListener('click', function(){
      var id = Number(sel.value);
      var item = null;
      menuItems.forEach(function(it){ if (it.id === id) item = it; });
      if (!item) return;
      var found = null;
      editDraft.lines.forEach(function(l){
        if (l.name === item.name && l.price === item.price) found = l;
      });
      if (found) { found.qty += 1; }
      else { editDraft.lines.push({ name: item.name, price: item.price, qty: 1 }); }
      renderOrders();
    });
    addRow.appendChild(addBtn);
    block.appendChild(addRow);

    var total = editDraft.lines.reduce(function(s, l){ return s + l.price * l.qty; }, 0);
    var totalEl = document.createElement('div');
    totalEl.className = 'edit-total';
    totalEl.innerHTML = yen(total) + ' <span class="tax">税込</span>';
    block.appendChild(totalEl);

    if (editDraft.lines.length === 0) {
      var warn = document.createElement('div');
      warn.className = 'edit-warn';
      warn.textContent = '品目がすべて削除されています。このままでは保存できません。注文そのものを取り消す場合は「キャンセル」で編集をやめてから「取消」ボタンを使ってください。';
      block.appendChild(warn);
    }

    var btns = document.createElement('div');
    btns.className = 'edit-btns';
    var saveBtn = document.createElement('button');
    saveBtn.className = 'oc-btn to-served';
    saveBtn.textContent = '保存';
    saveBtn.disabled = editDraft.lines.length === 0;
    if (saveBtn.disabled) saveBtn.style.opacity = '.4';
    saveBtn.addEventListener('click', function(){ saveEdit(saveBtn); });
    btns.appendChild(saveBtn);
    var cancelEditBtn = document.createElement('button');
    cancelEditBtn.className = 'oc-btn to-new';
    cancelEditBtn.textContent = 'キャンセル';
    cancelEditBtn.addEventListener('click', function(){
      editDraft = null;
      renderOrders();
    });
    btns.appendChild(cancelEditBtn);
    block.appendChild(btns);
    return block;
  }

  function saveEdit(btn){
    if (!editDraft) return;
    var lines = editDraft.lines.filter(function(l){ return l.qty > 0; });
    if (lines.length === 0) return;
    var total = lines.reduce(function(s, l){ return s + l.price * l.qty; }, 0);
    var id = editDraft.orderId;
    btn.disabled = true;
    sb.from('orders').update({ lines: lines, total: total }).eq('id', id)
      .then(function(res){
        btn.disabled = false;
        if (res.error) { showError('注文の変更に失敗しました。'); return; }
        orders.forEach(function(o){
          if (o.id === id) { o.lines = lines; o.total = total; }
        });
        editDraft = null;
        renderOrders();
        renderStats();
      });
  }

  function deleteOrder(o){
    if (!window.confirm('注文番号' + o.order_no + 'を取り消しますか？')) return;
    sb.from('orders').delete().eq('id', o.id)
      .then(function(res){
        if (res.error) { showError('注文の取消に失敗しました。'); return; }
        if (editDraft && editDraft.orderId === o.id) editDraft = null;
        orders = orders.filter(function(x){ return x.id !== o.id; });
        renderOrders();
        renderStats();
      });
  }

  // ---------- スタッフ注文 ----------
  var staffQty = {}; // menu_items.id -> 数量

  function initStaffPanel(){
    var sel = document.getElementById('staffSeat');
    var ph = document.createElement('option');
    ph.value = '';
    ph.textContent = '席を選択';
    sel.appendChild(ph);
    for (var i = 1; i <= 60; i++) {
      var opt = document.createElement('option');
      opt.value = i;
      opt.textContent = i + '番席';
      sel.appendChild(opt);
    }
    sel.addEventListener('change', updateStaffSubmitState);
  }

  function staffLinesAndTotal(){
    var lines = [], total = 0;
    menuItems.forEach(function(it){
      var q = staffQty[it.id] || 0;
      if (q > 0) {
        lines.push({ name: it.name, price: it.price, qty: q });
        total += it.price * q;
      }
    });
    return { lines: lines, total: total };
  }

  function updateStaffSubmitState(){
    var btn = document.getElementById('staffSubmit');
    if (!btn) return;
    var seat = parseInt(document.getElementById('staffSeat').value, 10);
    var lt = staffLinesAndTotal();
    btn.disabled = !(seat >= 1 && lt.lines.length > 0);
    btn.style.opacity = btn.disabled ? '.4' : '';
  }

  function updateStaffTotal(){
    document.getElementById('staffTotal').textContent = yen(staffLinesAndTotal().total);
    updateStaffSubmitState();
  }

  function renderStaffItems(){
    var root = document.getElementById('staffItems');
    if (!root) return;
    root.innerHTML = '';
    if (menuItems.length === 0) {
      root.innerHTML = '<div class="empty">メニューが登録されていません</div>';
      updateStaffTotal();
      return;
    }
    menuItems.forEach(function(it){
      var row = document.createElement('div');
      row.className = 'staff-item' + (it.sold_out ? ' is-soldout' : '');
      var info = document.createElement('div');
      info.className = 'si-info';
      info.innerHTML = '<span class="si-name">' + escapeHtml(it.name) + '</span>' +
        (it.sold_out ? '<span class="soldout-badge">売り切れ</span>' : '') +
        '<div class="si-price">' + yen(it.price) + '（税込）</div>';
      row.appendChild(info);
      row.appendChild(buildStepper(staffQty[it.id] || 0, it.sold_out, function(nq){
        staffQty[it.id] = nq;
        renderStaffItems();
      }));
      root.appendChild(row);
    });
    updateStaffTotal();
  }

  function openStaffPanel(seatNo){
    var panel = document.getElementById('staffPanel');
    panel.style.display = 'block';
    document.getElementById('staffOpenBtn').textContent = 'スタッフ注文を閉じる';
    if (seatNo) document.getElementById('staffSeat').value = String(seatNo);
    renderStaffItems();
    panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function closeStaffPanel(){
    document.getElementById('staffPanel').style.display = 'none';
    document.getElementById('staffOpenBtn').textContent = '＋ スタッフ注文を入れる';
  }

  document.getElementById('staffOpenBtn').addEventListener('click', function(){
    var panel = document.getElementById('staffPanel');
    if (panel.style.display === 'block') { closeStaffPanel(); }
    else { openStaffPanel(null); }
  });
  document.getElementById('staffCloseBtn').addEventListener('click', closeStaffPanel);
  document.getElementById('staffSubmit').addEventListener('click', function(){
    var seat = parseInt(document.getElementById('staffSeat').value, 10);
    var lt = staffLinesAndTotal();
    if (!(seat >= 1)) { showError('席番号を選択してください。'); return; }
    if (lt.lines.length === 0) { showError('品目を1つ以上選んでください。'); return; }
    var btn = this;
    btn.disabled = true;
    sb.from('orders').insert({
      seat_no: seat, lines: lt.lines, total: lt.total, status: 'new', paid: false
    }).then(function(res){
      btn.disabled = false;
      if (res.error) { showError('注文の登録に失敗しました。'); return; }
      staffQty = {};
      document.getElementById('staffSeat').value = '';
      closeStaffPanel();
      loadOrders();
    });
  });

  // 経過時間の表示を30秒ごとに更新
  setInterval(function(){
    document.querySelectorAll('[data-elapsed]').forEach(function(el){
      el.textContent = elapsedText(el.getAttribute('data-elapsed'));
    });
  }, 30000);

  function startPolling(){
    if (pollingTimer) return;
    connStatus.textContent = '自動更新（5秒間隔）';
    pollingTimer = setInterval(loadOrders, 5000);
  }

  function startRealtime(){
    var channel = sb.channel('yohaku-orders')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, function(){
        loadOrders();
      })
      .subscribe(function(status){
        if (status === 'SUBSCRIBED') {
          connStatus.textContent = 'リアルタイム接続中';
        } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
          startPolling();
        }
      });
    // 接続が確立しないままの場合の保険
    setTimeout(function(){
      if (connStatus.textContent === '接続中…') startPolling();
    }, 8000);
  }

  // ---------- メニュー管理 ----------
  var CATEGORY_LABELS = { meat: 'お肉（数量限定）', snack: 'おつまみ', soup: '汁物', glass_wine: 'グラスワイン', bottle_wine: 'ボトルワイン', wine: 'ワイン', shochu: '球磨焼酎', beer: 'ビール', soft_drink: 'ソフトドリンク', food: 'FOOD', drink: '球磨焼酎' };
  var menuItems = [];
  function loadMenu(){
    sb.from('menu_items').select('*')
      .order('sort', { ascending: true })
      .order('id', { ascending: true })
      .then(function(res){
        if (res.error) { showError('メニューの取得に失敗しました。'); return; }
        menuItems = res.data || [];
        renderMenuAdmin();
        renderStaffItems();
      });
  }

  function renderMenuAdmin(){
    var root = document.getElementById('menuRoot');
    root.innerHTML = '';
    if (menuItems.length === 0) {
      root.innerHTML = '<div class="empty">メニューが登録されていません</div>';
      return;
    }
    menuItems.forEach(function(it){
      var row = document.createElement('div');
      row.className = 'menu-row';
      var catLabel = CATEGORY_LABELS[it.category] || it.category;
      row.innerHTML =
        '<div><span class="mr-name">' + escapeHtml(it.name) + '</span><span class="mr-cat">' + catLabel + '</span></div>';

      var fields = document.createElement('div');
      fields.className = 'mr-fields';

      var priceLabel = document.createElement('label');
      priceLabel.textContent = '価格 ';
      var priceIn = document.createElement('input');
      priceIn.type = 'number'; priceIn.className = 'price';
      priceIn.min = '0'; priceIn.step = '1'; priceIn.value = it.price;
      priceLabel.appendChild(priceIn);
      fields.appendChild(priceLabel);

      var sortLabel = document.createElement('label');
      sortLabel.textContent = '並び順 ';
      var sortIn = document.createElement('input');
      sortIn.type = 'number'; sortIn.className = 'sort'; sortIn.value = it.sort;
      sortLabel.appendChild(sortIn);
      fields.appendChild(sortLabel);

      var soldBtn = document.createElement('button');
      soldBtn.className = 'soldout-toggle' + (it.sold_out ? ' on' : '');
      soldBtn.textContent = it.sold_out ? '売り切れ中' : '販売中';
      soldBtn.addEventListener('click', function(){
        sb.from('menu_items').update({ sold_out: !it.sold_out }).eq('id', it.id)
          .then(function(res){
            if (res.error) { showError('売り切れ切替に失敗しました。'); return; }
            it.sold_out = !it.sold_out;
            renderMenuAdmin();
          });
      });
      fields.appendChild(soldBtn);

      var saveBtn = document.createElement('button');
      saveBtn.className = 'small-btn primary';
      saveBtn.textContent = '保存';
      saveBtn.addEventListener('click', function(){
        var p = parseInt(priceIn.value, 10);
        var s = parseInt(sortIn.value, 10);
        if (isNaN(p) || p < 0) { showError('価格は0以上の整数で入力してください。'); return; }
        if (isNaN(s)) s = it.sort;
        saveBtn.disabled = true;
        sb.from('menu_items').update({ price: p, sort: s }).eq('id', it.id)
          .then(function(res){
            saveBtn.disabled = false;
            if (res.error) { showError('メニューの保存に失敗しました。'); return; }
            it.price = p; it.sort = s;
          });
      });
      fields.appendChild(saveBtn);

      var delBtn = document.createElement('button');
      delBtn.className = 'small-btn danger';
      delBtn.textContent = '削除';
      delBtn.addEventListener('click', function(){
        if (!window.confirm('「' + it.name + '」を削除しますか？')) return;
        sb.from('menu_items').delete().eq('id', it.id)
          .then(function(res){
            if (res.error) { showError('削除に失敗しました。'); return; }
            loadMenu();
          });
      });
      fields.appendChild(delBtn);

      row.appendChild(fields);
      root.appendChild(row);
    });
  }

  document.getElementById('addBtn').addEventListener('click', function(){
    var name = document.getElementById('addName').value.trim();
    var desc = document.getElementById('addDesc').value.trim();
    var price = parseInt(document.getElementById('addPrice').value, 10);
    var category = document.getElementById('addCategory').value;
    var sort = parseInt(document.getElementById('addSort').value, 10);
    if (!name) { showError('品目名を入力してください。'); return; }
    if (isNaN(price) || price < 0) { showError('価格は0以上の整数で入力してください。'); return; }
    if (isNaN(sort)) sort = 50;
    sb.from('menu_items').insert({
      name: name, description: desc, price: price, category: category, sort: sort, sold_out: false
    }).then(function(res){
      if (res.error) { showError('品目の追加に失敗しました。'); return; }
      document.getElementById('addName').value = '';
      document.getElementById('addDesc').value = '';
      document.getElementById('addPrice').value = '';
      loadMenu();
    });
  });

  // ---------- 売上集計 ----------
  var EVENT_DAYS = ['2026-11-13', '2026-11-14', '2026-11-15'];
  var salesDate = null;      // 選択中の日 'YYYY-MM-DD'（JSTの暦日）
  var salesOrders = [];      // 選択中の日の注文（集計・CSV用）
  var salesFilter = 'all';   // 注文履歴のフィルタ: 'all' | 'paid' | 'unpaid'

  // Asia/Tokyo の今日を 'YYYY-MM-DD' で返す（端末のTZに依存しない）
  function jstTodayStr(){
    var parts = new Intl.DateTimeFormat('en-US', {
      timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit'
    }).formatToParts(new Date());
    var y, m, d;
    parts.forEach(function(p){
      if (p.type === 'year') y = p.value;
      if (p.type === 'month') m = p.value;
      if (p.type === 'day') d = p.value;
    });
    return y + '-' + m + '-' + d;
  }

  // 'YYYY-MM-DD'（JST暦日）の [0:00, 翌0:00) を UTC の ISO 文字列で返す
  function dayRangeISO(dateStr){
    var p = dateStr.split('-');
    var startMs = Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2])) - 9 * 3600 * 1000;
    return {
      start: new Date(startMs).toISOString(),
      end: new Date(startMs + 24 * 3600 * 1000).toISOString()
    };
  }

  function initSales(){
    salesDate = jstTodayStr();
    var input = document.getElementById('salesDate');
    input.value = salesDate;
    input.addEventListener('change', function(){
      if (!input.value) return;
      salesDate = input.value;
      markDayButtons();
      loadSales();
    });
    document.querySelectorAll('.day-btn').forEach(function(b){
      b.addEventListener('click', function(){
        salesDate = b.getAttribute('data-day');
        input.value = salesDate;
        markDayButtons();
        loadSales();
      });
    });
    document.getElementById('csvItemsBtn').addEventListener('click', downloadItemsCsv);
    document.getElementById('csvOrdersBtn').addEventListener('click', downloadOrdersCsv);
    markDayButtons();
    loadSales();
    loadSalesPeriod();
  }

  function markDayButtons(){
    document.querySelectorAll('.day-btn').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-day') === salesDate);
    });
  }

  function loadSales(){
    var range = dayRangeISO(salesDate);
    var root = document.getElementById('salesRoot');
    root.innerHTML = '<div class="empty">読み込んでいます…</div>';
    sb.from('orders').select('id, order_no, seat_no, lines, total, status, paid, created_at')
      .gte('created_at', range.start)
      .lt('created_at', range.end)
      .order('created_at', { ascending: true })
      .then(function(res){
        if (res.error) { showError('売上集計の取得に失敗しました。'); return; }
        // 日付が切り替わっていたら古い結果は捨てる
        if (document.getElementById('salesDate').value !== salesDate) return;
        salesOrders = res.data || [];
        renderSales();
      });
  }

  // 品目別集計（品名でグループ化、金額降順）
  function aggregateItems(list){
    var map = {};
    list.forEach(function(o){
      (o.lines || []).forEach(function(l){
        if (!map[l.name]) map[l.name] = { name: l.name, qty: 0, amount: 0 };
        map[l.name].qty += l.qty;
        map[l.name].amount += l.price * l.qty;
      });
    });
    return Object.keys(map).map(function(k){ return map[k]; })
      .sort(function(a, b){ return b.amount - a.amount; });
  }

  function renderSales(){
    var root = document.getElementById('salesRoot');
    root.innerHTML = '';
    if (salesOrders.length === 0) {
      root.innerHTML = '<div class="empty">この日の注文はありません</div>';
      return;
    }
    var total = 0, paidSum = 0, unpaidSum = 0;
    var seatSet = {};
    salesOrders.forEach(function(o){
      total += o.total;
      if (o.paid) { paidSum += o.total; } else { unpaidSum += o.total; }
      seatSet[o.seat_no] = true;
    });

    var grid = document.createElement('div');
    grid.className = 'sales-grid';
    function sgItem(label, value, pending){
      return '<div class="sg-item"><div class="sg-label">' + label + '</div>' +
        '<div class="sg-value' + (pending ? ' pending' : '') + '">' + value + '</div></div>';
    }
    grid.innerHTML =
      sgItem('売上合計（税込）', yen(total)) +
      sgItem('注文件数', salesOrders.length + ' 件') +
      sgItem('利用テーブル数', Object.keys(seatSet).length + ' テーブル') +
      sgItem('決済済み', yen(paidSum)) +
      sgItem('未決済', yen(unpaidSum), unpaidSum > 0);
    root.appendChild(grid);

    var items = aggregateItems(salesOrders);
    var table = document.createElement('table');
    table.className = 'sales-table';
    var html = '<tr><th>品名</th><th>数量</th><th>金額</th></tr>';
    items.forEach(function(it){
      html += '<tr><td>' + escapeHtml(it.name) + '</td><td>' + it.qty + '</td><td>' + yen(it.amount) + '</td></tr>';
    });
    table.innerHTML = html;
    root.appendChild(table);

    // 注文履歴（フィルタ付き）
    var histWrap = document.createElement('div');
    histWrap.innerHTML =
      '<div class="hist-title">注文履歴</div>' +
      '<div class="hist-filter-row">' +
        '<button class="hist-btn" data-filter="all">すべて</button>' +
        '<button class="hist-btn" data-filter="paid">決済済みのみ</button>' +
        '<button class="hist-btn" data-filter="unpaid">未決済のみ</button>' +
      '</div>' +
      '<div id="salesHistoryList"></div>';
    root.appendChild(histWrap);
    histWrap.querySelectorAll('.hist-btn').forEach(function(b){
      b.addEventListener('click', function(){
        salesFilter = b.getAttribute('data-filter');
        renderSalesHistory();
      });
    });
    renderSalesHistory();
  }

  var jstHourMinFmt = new Intl.DateTimeFormat('ja-JP', {
    timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit', hour12: false
  });

  // 注文履歴リスト（選択中の日の注文を新しい順に、フィルタ適用）
  function renderSalesHistory(){
    document.querySelectorAll('.hist-btn').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-filter') === salesFilter);
    });
    var root = document.getElementById('salesHistoryList');
    if (!root) return;
    root.innerHTML = '';
    var list = salesOrders.filter(function(o){
      if (salesFilter === 'paid') return o.paid;
      if (salesFilter === 'unpaid') return !o.paid;
      return true;
    }).slice().sort(function(a, b){
      return new Date(b.created_at) - new Date(a.created_at);
    });
    if (list.length === 0) {
      root.innerHTML = '<div class="empty">該当する注文はありません</div>';
      return;
    }
    list.forEach(function(o){
      var row = document.createElement('div');
      row.className = 'hist-row';
      var lines = (o.lines || []).map(function(l){
        return escapeHtml(l.name) + '×' + l.qty;
      }).join('、');
      row.innerHTML =
        '<div class="hist-head">' +
          '<span class="hist-time">' + jstHourMinFmt.format(new Date(o.created_at)) + '</span>' +
          '<span class="hist-no">No.' + o.order_no + '</span>' +
          '<span class="hist-seat">' + o.seat_no + '番席</span>' +
          (o.paid ? '<span class="paid-badge">決済済み</span>' : '<span class="unpaid-badge">未決済</span>') +
          '<span class="hist-total">' + yen(o.total) + '</span>' +
        '</div>' +
        '<div class="hist-lines">' + lines + '</div>';
      root.appendChild(row);
    });
  }

  // 開催期間（11/13〜15）の売上合計を併記
  function loadSalesPeriod(){
    var start = dayRangeISO(EVENT_DAYS[0]).start;
    var end = dayRangeISO(EVENT_DAYS[EVENT_DAYS.length - 1]).end;
    sb.from('orders').select('total')
      .gte('created_at', start)
      .lt('created_at', end)
      .then(function(res){
        var el = document.getElementById('salesPeriod');
        if (res.error || !res.data) { el.textContent = ''; return; }
        var sum = res.data.reduce(function(s, o){ return s + o.total; }, 0);
        el.innerHTML = '開催期間（11/13〜15）の売上合計：<b>' + yen(sum) + '</b>（税込・' + res.data.length + '件）';
      });
  }

  // ---------- CSV ----------
  function csvCell(v){
    var s = String(v == null ? '' : v);
    if (/[",\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function downloadCsv(filename, rows){
    var body = rows.map(function(r){ return r.map(csvCell).join(','); }).join('\r\n');
    var blob = new Blob(['\uFEFF' + body], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function salesFileDate(){
    return salesDate.replace(/-/g, '');
  }

  function downloadItemsCsv(){
    var rows = [['日付', '品名', '数量', '金額']];
    aggregateItems(salesOrders).forEach(function(it){
      rows.push([salesDate, it.name, it.qty, it.amount]);
    });
    downloadCsv('yohaku-sales-' + salesFileDate() + '-items.csv', rows);
  }

  var jstTimeFmt = new Intl.DateTimeFormat('ja-JP', {
    timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
  });

  function downloadOrdersCsv(){
    var rows = [['注文番号', '席番号', '時刻', '内容', '金額', '決済済み']];
    salesOrders.forEach(function(o){
      var content = (o.lines || []).map(function(l){
        return l.name + '×' + l.qty;
      }).join(' / ');
      rows.push([
        o.order_no, o.seat_no, jstTimeFmt.format(new Date(o.created_at)),
        content, o.total, o.paid ? '決済済み' : '未決済'
      ]);
    });
    downloadCsv('yohaku-sales-' + salesFileDate() + '-orders.csv', rows);
  }

  // ---------- ハンバーガードロワー ----------
  // ボタン・ドロワー・オーバーレイは #mainView 内にあるため、
  // ログイン前（#mainView が display:none の間）はPIN画面に出ない
  var drawerEl = document.getElementById('drawer');
  var drawerOverlayEl = document.getElementById('drawerOverlay');
  function openDrawer(){
    drawerEl.classList.add('open');
    drawerOverlayEl.classList.add('open');
  }
  function closeDrawer(){
    drawerEl.classList.remove('open');
    drawerOverlayEl.classList.remove('open');
  }
  function scrollToSection(el){
    closeDrawer();
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  document.getElementById('drawerBtn').addEventListener('click', openDrawer);
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  drawerOverlayEl.addEventListener('click', closeDrawer);
  document.getElementById('navOrders').addEventListener('click', function(){
    scrollToSection(document.getElementById('ordersRoot'));
  });
  document.getElementById('navStaff').addEventListener('click', function(){
    closeDrawer();
    openStaffPanel(null); // パネルを開き、その位置へスクロールする
  });
  document.getElementById('navMenu').addEventListener('click', function(){
    scrollToSection(document.getElementById('menuSection'));
  });
  document.getElementById('navSales').addEventListener('click', function(){
    scrollToSection(document.getElementById('salesSection'));
  });

  function startApp(){
    initStaffPanel();
    loadOrders();
    loadMenu();
    initSales();
    startRealtime();
  }
})();
</script>
</body>
</html>
