<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YOHAKU｜余白 — ご注文</title>
<style>
  :root{
    --ink:#2b2b28; --muted:#8a867c; --line:#e7e2d8; --bg:#fdfcf9;
    --accent:#5c6650; --accent-dark:#47523e; --soldout:#b9b3a6;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--ink); padding-bottom:120px;
  }
  header{
    text-align:center; padding:28px 16px 18px; border-bottom:1px solid var(--line);
  }
  .brand{
    font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    font-size:26px; letter-spacing:.45em; text-indent:.45em; font-weight:600;
  }
  .brand-sub{ font-size:11px; color:var(--muted); letter-spacing:.25em; margin-top:6px; }
  .event{ font-size:11px; color:var(--muted); margin-top:10px; letter-spacing:.08em; }
  .seat-bar{
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding:12px 16px; border-bottom:1px solid var(--line); background:#fff;
    position:sticky; top:0; z-index:5;
  }
  .seat-label{ font-size:12px; color:var(--muted); letter-spacing:.15em; }
  .seat-value{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:20px; font-weight:600;
  }
  .seat-select{ font-size:16px; padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  main{ max-width:560px; margin:0 auto; padding:0 16px; }
  .cat-title{
    font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    font-size:15px; letter-spacing:.3em; margin:26px 0 6px; color:var(--accent-dark);
  }
  .item{
    display:flex; align-items:center; gap:12px;
    padding:14px 2px; border-bottom:1px dashed var(--line);
  }
  .item-info{ flex:1; min-width:0; }
  .item-name{ font-size:15px; font-weight:600; }
  .item-desc{ font-size:11px; color:var(--muted); margin-top:3px; }
  .item-price{ font-size:13px; margin-top:5px; }
  .item.soldout .item-name, .item.soldout .item-price{ color:var(--soldout); }
  .soldout-badge{
    display:inline-block; font-size:10px; color:#fff; background:var(--soldout);
    border-radius:4px; padding:2px 7px; margin-left:8px; letter-spacing:.1em; vertical-align:2px;
  }
  .stepper{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .step-btn{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--line);
    background:#fff; color:var(--ink); font-size:18px; line-height:1; cursor:pointer;
  }
  .step-btn:active{ background:#f3f0e8; }
  .step-btn:disabled{ opacity:.3; cursor:default; }
  .qty{ font-size:16px; font-weight:600; min-width:18px; text-align:center; }
  .footer-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    background:#fff; border-top:1px solid var(--line);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 18px rgba(60,55,40,.06);
  }
  .footer-inner{ max-width:560px; margin:0 auto; display:flex; align-items:center; gap:14px; }
  .total-box{ flex:1; }
  .total-label{ font-size:11px; color:var(--muted); letter-spacing:.12em; }
  .total-value{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:24px; font-weight:700;
  }
  .total-count{ font-size:11px; color:var(--muted); margin-left:6px; }
  #orderBtn{
    background:var(--accent); color:#fff; border:none; border-radius:10px;
    font-size:16px; letter-spacing:.2em; padding:15px 26px; cursor:pointer; font-weight:600;
  }
  #orderBtn:disabled{ background:#cfccc2; cursor:default; }
  .notice{ text-align:center; font-size:11px; color:var(--muted); margin-top:20px; line-height:1.9; }
  .error-box{
    max-width:560px; margin:24px auto; padding:18px; border:1px solid #d8a7a0;
    background:#fdf3f1; border-radius:10px; font-size:13px; line-height:1.8; display:none;
  }
  /* 完了画面 */
  #doneView{ display:none; text-align:center; padding:56px 24px; }
  #doneView .done-mark{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:20px; letter-spacing:.3em; text-indent:.3em; color:var(--accent-dark);
  }
  #doneView .done-no{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:64px; font-weight:700; margin:18px 0 4px;
  }
  #doneView .done-no-label{ font-size:12px; color:var(--muted); letter-spacing:.2em; }
  #doneView .done-total{ font-size:18px; margin-top:22px; }
  #doneView .done-msg{ font-size:13px; color:var(--muted); line-height:2; margin-top:16px; }
  #againBtn{
    margin-top:30px; background:#fff; color:var(--accent-dark);
    border:1px solid var(--accent); border-radius:10px;
    font-size:14px; letter-spacing:.15em; padding:12px 24px; cursor:pointer;
  }
  .ghost-btn{
    background:#fff; color:var(--accent-dark);
    border:1px solid var(--accent); border-radius:10px;
    font-size:14px; letter-spacing:.15em; padding:12px 24px; cursor:pointer;
  }
  .status-link-wrap{ text-align:center; margin:26px 0 10px; }
  .status-hint{ font-size:12px; color:#b0564a; margin-top:10px; }
  #doneStatusBtn{ margin-top:14px; }
  /* 注文状況画面 */
  #statusView{ display:none; max-width:560px; margin:0 auto; padding:28px 16px 40px; }
  #statusView .status-head{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:20px; letter-spacing:.3em; text-indent:.3em; text-align:center; color:var(--accent-dark);
  }
  #statusView .status-seat{ text-align:center; font-size:13px; color:var(--muted); margin-top:8px; letter-spacing:.1em; }
  .status-summary{
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:16px 18px; margin-top:22px;
  }
  .status-total-row{ display:flex; align-items:baseline; justify-content:space-between; padding:4px 0; }
  .status-total-row .st-label{ font-size:13px; color:var(--muted); letter-spacing:.08em; }
  .status-total-row .st-value{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:24px; font-weight:700;
  }
  .status-total-row.unpaid .st-value{ font-size:20px; color:#b0564a; }
  .status-order{
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:14px 18px; margin-top:14px;
  }
  .status-order-head{ display:flex; align-items:center; justify-content:space-between; }
  .status-order-no{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:16px; font-weight:700;
  }
  .status-order-amount{ font-size:16px; font-weight:700; }
  .paid-badge{
    display:inline-block; font-size:10px; color:#fff; background:var(--accent);
    border-radius:4px; padding:2px 7px; margin-left:8px; letter-spacing:.1em; vertical-align:2px;
  }
  .status-lines{ font-size:13px; line-height:1.9; margin-top:8px; color:var(--ink); }
  .status-empty{ text-align:center; color:var(--muted); font-size:14px; padding:36px 0 8px; }
  .status-load-error{ text-align:center; color:#b0564a; font-size:13px; padding:24px 0 8px; }
  #statusBackBtn{ display:block; margin:30px auto 0; }
  .loading{ text-align:center; color:var(--muted); font-size:13px; padding:40px 0; }
</style>
</head>
<body>

<div id="orderView">
  <header>
    <div class="brand">YOHAKU</div>
    <div class="brand-sub">余 白</div>
    <div class="event">虎ノ門横丁 POPUP ｜ 11/13–15 16:00–22:00</div>
  </header>

  <div class="seat-bar">
    <span class="seat-label">席番号</span>
    <span class="seat-value" id="seatDisplay"></span>
    <select class="seat-select" id="seatSelect" style="display:none" aria-label="席番号を選択"></select>
  </div>

  <div class="error-box" id="errorBox"></div>

  <main id="menuRoot">
    <div class="loading" id="loadingMsg">メニューを読み込んでいます…</div>
  </main>

  <p class="notice">お支払いはレジにてお願いいたします。<br>追加のご注文も、この画面からどうぞ。</p>

  <div class="status-link-wrap">
    <button class="ghost-btn" id="statusBtn">ご注文状況を見る</button>
    <p class="status-hint" id="statusHint" style="display:none">まず、お席の番号を選択してください。</p>
  </div>

  <div class="footer-bar">
    <div class="footer-inner">
      <div class="total-box">
        <div class="total-label">合計（税込）<span class="total-count" id="totalCount"></span></div>
        <div class="total-value" id="totalValue">¥0</div>
      </div>
      <button id="orderBtn" disabled>注文する</button>
    </div>
  </div>
</div>

<div id="doneView">
  <div class="done-mark">ご注文ありがとうございます</div>
  <div class="done-no" id="doneNo">–</div>
  <div class="done-no-label">注 文 番 号</div>
  <div class="done-total">合計（税込）<b id="doneTotal">¥0</b></div>
  <p class="done-msg">お料理の準備ができ次第、お席までお持ちします。<br>お支払いはレジにてお願いいたします。</p>
  <button id="againBtn">続けて注文する</button>
  <br>
  <button class="ghost-btn" id="doneStatusBtn">注文状況を見る</button>
</div>

<div id="statusView">
  <div class="status-head">ご注文状況</div>
  <div class="status-seat" id="statusSeat"></div>
  <div class="status-summary">
    <div class="status-total-row">
      <span class="st-label">現在のお会計（合計）</span>
      <span class="st-value" id="statusGrandTotal">¥0</span>
    </div>
    <div class="status-total-row unpaid">
      <span class="st-label">未決済の残額</span>
      <span class="st-value" id="statusUnpaid">¥0</span>
    </div>
  </div>
  <div id="statusList"></div>
  <button class="ghost-btn" id="statusBackBtn">メニューに戻る</button>
</div>

<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";
  var cfg = window.YOHAKU_CONFIG || {};
  var errorBox = document.getElementById('errorBox');

  function showError(msg){
    errorBox.style.display = 'block';
    errorBox.textContent = msg;
  }
  function yen(n){ return '¥' + n.toLocaleString('ja-JP'); }

  // ---- 設定チェック ----
  if (!cfg.SUPABASE_URL || cfg.SUPABASE_URL.indexOf('YOUR_') === 0 ||
      !cfg.SUPABASE_ANON_KEY || cfg.SUPABASE_ANON_KEY.indexOf('YOUR_') === 0) {
    document.getElementById('loadingMsg').style.display = 'none';
    showError('設定が完了していません。お手数ですが、スタッフまでお声がけください。（config.js に Supabase の URL と anon key を設定してください）');
    return;
  }
  var sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

  // ---- 席番号 ----
  var params = new URLSearchParams(location.search);
  var seatParam = parseInt(params.get('seat'), 10);
  var seatNo = (seatParam >= 1 && seatParam <= 60) ? seatParam : null;
  var seatDisplay = document.getElementById('seatDisplay');
  var seatSelect = document.getElementById('seatSelect');
  if (seatNo) {
    seatDisplay.textContent = seatNo + ' 番';
  } else {
    seatDisplay.style.display = 'none';
    seatSelect.style.display = '';
    var opt0 = document.createElement('option');
    opt0.value = ''; opt0.textContent = '選択してください';
    seatSelect.appendChild(opt0);
    for (var i = 1; i <= 60; i++) {
      var o = document.createElement('option');
      o.value = i; o.textContent = i + ' 番席';
      seatSelect.appendChild(o);
    }
    seatSelect.addEventListener('change', function(){
      seatNo = seatSelect.value ? parseInt(seatSelect.value, 10) : null;
      var hint = document.getElementById('statusHint');
      if (hint && seatNo) hint.style.display = 'none';
      refreshOrderBtn();
    });
  }

  // ---- メニュー取得と描画 ----
  var CATEGORY_LABELS = { meat: 'お肉（数量限定）', snack: 'おつまみ', soup: '汁物', wine: 'ワイン', shochu: '球磨焼酎', food: 'FOOD', drink: '球磨焼酎' };
  var CATEGORY_ORDER = ['meat', 'snack', 'soup', 'wine', 'shochu', 'food', 'drink'];
  var items = [];           // menu_items
  var qty = {};             // id -> 個数

  var menuRoot = document.getElementById('menuRoot');
  var totalValue = document.getElementById('totalValue');
  var totalCount = document.getElementById('totalCount');
  var orderBtn = document.getElementById('orderBtn');

  function calcTotal(){
    var total = 0, count = 0;
    items.forEach(function(it){
      var q = qty[it.id] || 0;
      total += it.price * q;
      count += q;
    });
    return { total: total, count: count };
  }
  function refreshOrderBtn(){
    var t = calcTotal();
    totalValue.textContent = yen(t.total);
    totalCount.textContent = t.count > 0 ? '（' + t.count + '点）' : '';
    orderBtn.disabled = !(t.count > 0 && seatNo);
  }

  function renderMenu(){
    menuRoot.innerHTML = '';
    var cats = {};
    items.forEach(function(it){
      if (!cats[it.category]) cats[it.category] = [];
      cats[it.category].push(it);
    });
    var order = CATEGORY_ORDER.filter(function(c){ return cats[c]; });
    Object.keys(cats).forEach(function(c){ if (order.indexOf(c) < 0) order.push(c); });

    order.forEach(function(cat){
      var h = document.createElement('div');
      h.className = 'cat-title';
      h.textContent = CATEGORY_LABELS[cat] || cat;
      menuRoot.appendChild(h);

      cats[cat].forEach(function(it){
        var row = document.createElement('div');
        row.className = 'item' + (it.sold_out ? ' soldout' : '');

        var info = document.createElement('div');
        info.className = 'item-info';
        var nameHtml = escapeHtml(it.name);
        if (it.sold_out) nameHtml += '<span class="soldout-badge">売り切れ</span>';
        info.innerHTML =
          '<div class="item-name">' + nameHtml + '</div>' +
          (it.description ? '<div class="item-desc">' + escapeHtml(it.description) + '</div>' : '') +
          '<div class="item-price">' + yen(it.price) + '</div>';
        row.appendChild(info);

        var stepper = document.createElement('div');
        stepper.className = 'stepper';
        var minus = document.createElement('button');
        minus.className = 'step-btn'; minus.textContent = '−';
        var q = document.createElement('span');
        q.className = 'qty'; q.textContent = qty[it.id] || 0;
        var plus = document.createElement('button');
        plus.className = 'step-btn'; plus.textContent = '＋';

        function sync(){
          q.textContent = qty[it.id] || 0;
          minus.disabled = !qty[it.id];
          plus.disabled = it.sold_out;
          refreshOrderBtn();
        }
        minus.addEventListener('click', function(){
          qty[it.id] = Math.max(0, (qty[it.id] || 0) - 1);
          sync();
        });
        plus.addEventListener('click', function(){
          if (it.sold_out) return;
          qty[it.id] = (qty[it.id] || 0) + 1;
          sync();
        });
        stepper.appendChild(minus);
        stepper.appendChild(q);
        stepper.appendChild(plus);
        row.appendChild(stepper);
        menuRoot.appendChild(row);
        sync();
      });
    });
    refreshOrderBtn();
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function loadMenu(){
    sb.from('menu_items').select('*').order('sort', { ascending: true }).order('id', { ascending: true })
      .then(function(res){
        if (res.error) {
          document.getElementById('loadingMsg').style.display = 'none';
          showError('メニューの取得に失敗しました。電波の良い場所で再読み込みしてください。');
          return;
        }
        items = res.data || [];
        // 売り切れになった品目の数量はリセット
        items.forEach(function(it){ if (it.sold_out) qty[it.id] = 0; });
        renderMenu();
      });
  }
  loadMenu();
  // 売り切れ状態の変化を拾うため、画面に戻ってきたら再取得
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) loadMenu();
  });

  // ---- 注文送信 ----
  var sending = false;
  orderBtn.addEventListener('click', function(){
    if (sending) return;
    var t = calcTotal();
    if (t.count === 0 || !seatNo) return;

    var lines = [];
    items.forEach(function(it){
      var q = qty[it.id] || 0;
      if (q > 0) lines.push({ name: it.name, price: it.price, qty: q });
    });

    sending = true;
    orderBtn.disabled = true;
    orderBtn.textContent = '送信中…';

    sb.from('orders').insert({
      seat_no: seatNo,
      lines: lines,
      total: t.total,
      status: 'new'
    }).select('order_no').single()
    .then(function(res){
      sending = false;
      orderBtn.textContent = '注文する';
      if (res.error) {
        orderBtn.disabled = false;
        showError('注文の送信に失敗しました。もう一度お試しください。');
        return;
      }
      document.getElementById('doneNo').textContent = res.data.order_no;
      document.getElementById('doneTotal').textContent = yen(t.total);
      document.getElementById('orderView').style.display = 'none';
      document.getElementById('doneView').style.display = 'block';
      window.scrollTo(0, 0);
      // 数量リセット（追加注文に備える）
      qty = {};
    });
  });

  document.getElementById('againBtn').addEventListener('click', function(){
    document.getElementById('doneView').style.display = 'none';
    document.getElementById('orderView').style.display = 'block';
    errorBox.style.display = 'none';
    loadMenu();
  });

  // ---- 注文状況 ----
  var orderView = document.getElementById('orderView');
  var doneView = document.getElementById('doneView');
  var statusView = document.getElementById('statusView');
  var statusList = document.getElementById('statusList');
  var statusTimer = null;

  // JST 当日 0:00 の ISO 文字列（created_at の下限フィルタ用）
  function todayStartISO(){
    var parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit'
    }).formatToParts(new Date());
    var y = 0, m = 0, d = 0;
    parts.forEach(function(p){
      if (p.type === 'year') y = parseInt(p.value, 10);
      if (p.type === 'month') m = parseInt(p.value, 10);
      if (p.type === 'day') d = parseInt(p.value, 10);
    });
    // JST 0:00 = 前日 15:00 UTC
    return new Date(Date.UTC(y, m - 1, d) - 9 * 60 * 60 * 1000).toISOString();
  }

  function renderStatus(orders){
    var grand = 0, unpaid = 0;
    statusList.innerHTML = '';
    if (!orders.length) {
      var empty = document.createElement('div');
      empty.className = 'status-empty';
      empty.textContent = 'まだ注文がありません';
      statusList.appendChild(empty);
    }
    orders.forEach(function(o){
      grand += o.total;
      if (!o.paid) unpaid += o.total;
      var card = document.createElement('div');
      card.className = 'status-order';
      var head = document.createElement('div');
      head.className = 'status-order-head';
      var noHtml = '注文番号 ' + o.order_no;
      // お客様に見せる状態は「決済済み」のみ（提供ステータスは表示しない）
      if (o.paid) noHtml += '<span class="paid-badge">決済済み</span>';
      head.innerHTML =
        '<span class="status-order-no">' + noHtml + '</span>' +
        '<span class="status-order-amount">' + yen(o.total) + '</span>';
      card.appendChild(head);
      var lines = document.createElement('div');
      lines.className = 'status-lines';
      lines.innerHTML = (o.lines || []).map(function(l){
        return escapeHtml(l.name) + ' ×' + l.qty;
      }).join('<br>');
      card.appendChild(lines);
      statusList.appendChild(card);
    });
    document.getElementById('statusGrandTotal').textContent = yen(grand);
    document.getElementById('statusUnpaid').textContent = yen(unpaid);
  }

  function loadStatus(){
    if (!seatNo) return;
    sb.from('orders')
      .select('order_no, lines, total, status, paid, created_at')
      .eq('seat_no', seatNo)
      .gte('created_at', todayStartISO())
      .order('order_no', { ascending: true })
      .then(function(res){
        if (res.error) {
          statusList.innerHTML = '<div class="status-load-error">読み込みに失敗しました。しばらくすると自動で再読み込みします。</div>';
          return;
        }
        renderStatus(res.data || []);
      });
  }

  function stopStatusPolling(){
    if (statusTimer) { clearInterval(statusTimer); statusTimer = null; }
  }
  function showStatus(){
    if (!seatNo) {
      // 席が未選択なら、既存の席セレクトへ誘導する
      var hint = document.getElementById('statusHint');
      if (hint) hint.style.display = 'block';
      window.scrollTo(0, 0);
      seatSelect.focus();
      return;
    }
    document.getElementById('statusSeat').textContent = seatNo + ' 番席';
    orderView.style.display = 'none';
    doneView.style.display = 'none';
    statusView.style.display = 'block';
    window.scrollTo(0, 0);
    loadStatus();
    stopStatusPolling();
    // 状況画面を開いている間だけ10秒ごとに自動更新（決済済みの変化などを反映）
    statusTimer = setInterval(loadStatus, 10000);
  }
  function hideStatus(){
    stopStatusPolling();
    statusView.style.display = 'none';
    doneView.style.display = 'none';
    orderView.style.display = 'block';
    errorBox.style.display = 'none';
    window.scrollTo(0, 0);
    loadMenu();
  }

  document.getElementById('statusBtn').addEventListener('click', showStatus);
  document.getElementById('doneStatusBtn').addEventListener('click', showStatus);
